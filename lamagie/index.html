<style>

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;}
html{scroll-behavior:smooth;}

body{
  background-color:#ece2c8;
  color:#3a3220;
  font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  font-weight:400;
  font-size:17px;
  line-height:1.75;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  background-image:
    radial-gradient(ellipse 55% 50% at 12% 18%,  rgba(146, 96, 38, 0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 55% at 88% 82%,  rgba(132, 88, 36, 0.11) 0%, transparent 60%),
    radial-gradient(ellipse 60% 45% at 78% 18%,  rgba(170,128, 60, 0.09) 0%, transparent 65%),
    radial-gradient(ellipse 55% 50% at 22% 82%,  rgba(160,118, 50, 0.10) 0%, transparent 65%),
    radial-gradient(ellipse 75% 60% at 50% 35%,  rgba(212,176,114, 0.10) 0%, transparent 75%),
    linear-gradient(135deg, #f1ead4 0%, #e8dec0 50%, #ecdfc2 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 0.42 0 0 0 0 0.32 0 0 0 0 0.17 0 0 0 0.22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
  background-attachment:fixed;
  background-size:auto,auto,auto,auto,auto,auto,280px 280px;
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,repeat;
}

a{color:inherit;text-decoration:none;}
img{max-width:100%;height:auto;display:block;}
em{font-style:italic;color:#5a4a30;}
::selection{background:rgba(184,154,92,.32);color:#3a3220;}

.bandeau-top{
  background:#ece2c8;
  padding:8px 40px;
  text-align:center;
  font-size:0.9rem;
  color:#5a4a30;
  border-bottom:1px solid rgba(184,154,92,.2);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.toggle-langue{
  display:flex;
  gap:12px;
  align-items:center;
}

.toggle-langue button{
  background:transparent;
  border:1px solid rgba(184,154,92,.4);
  padding:4px 12px;
  border-radius:2px;
  cursor:pointer;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:0.85rem;
  color:#5a4a30;
  transition:all 0.3s;
}

.toggle-langue button.active{
  background:#b89a5c;
  color:white;
  border-color:#b89a5c;
}

.toggle-langue button:hover{
  background:rgba(184,154,92,.1);
}

.page-maquette{
  aspect-ratio:1024/1536;
  background:url('images/fond-maquette.png') no-repeat center/cover;
  position:relative;
  margin:40px auto;
  max-width:90%;
  box-shadow:0 10px 40px rgba(0,0,0,0.1);
}

.cercle-anime{
  position:absolute;
  top:48.5%;
  left:50%;
  transform:translate(-50%, -50%);
  width:120px;
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:reveal-color 4s ease-in-out infinite;
}

.cercle-anime img{
  width:100%;
  height:100%;
  filter:grayscale(100%);
  animation:color-shift 4s ease-in-out infinite;
}

@keyframes reveal-color{
  0%, 100%{filter:brightness(1);}
  50%{filter:brightness(1.1) saturate(1);}
}

@keyframes color-shift{
  0%, 100%{filter:grayscale(100%);}
  50%{filter:grayscale(0%);}
}

.hotspot{
  position:absolute;
  cursor:pointer;
  background:transparent;
  border:none;
  opacity:0;
  transition:opacity 0.3s;
}

.hotspot:hover{opacity:0.1;}

.page-maquette:hover .hotspot:hover{background:rgba(184,154,92,0.2);}

.plan-du-site{
  max-width:1200px;
  margin:60px auto;
  padding:0 40px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:40px;
}

.plan-section h3{
  font-size:1.1rem;
  font-weight:500;
  color:#3a3220;
  margin-bottom:16px;
  border-bottom:1px solid rgba(184,154,92,.2);
  padding-bottom:8px;
}

.plan-section ul{
  list-style:none;
  padding:0;
}

.plan-section li{
  margin:8px 0;
}

.plan-section a{
  color:#5a4a30;
  text-decoration:none;
  font-size:0.95rem;
  transition:color 0.3s;
}

.plan-section a:hover{
  color:#b89a5c;
  text-decoration:underline;
}

footer{
  text-align:center;
  padding:40px;
  border-top:1px solid rgba(184,154,92,.2);
  color:#5a4a30;
  font-size:0.9rem;
}

h1{
  text-align:center;
  font-size:2.2rem;
  margin:40px 20px;
  color:#3a3220;
}

@media(max-width:768px){
  .bandeau-top{flex-direction:column;gap:12px;padding:12px 16px;}
  .plan-du-site{grid-template-columns:1fr;gap:20px;padding:0 16px 20px;}
  .page-maquette{margin:20px auto;max-width:95%;}
}
</style>
</head>

<script>

const contentFR = {
  bandeau: "Les éditions L'AMagie soutiennent les librairies indépendantes",
  titre: "",
  section1: "✦ Qui sommes-nous ?",
  link1_1: "Qui sommes-nous",

  link2_3: "Médiation animale",
  link2_4: "Collection Amis-Mots",
  section3: "✦ Éditions",
  link3_1: "Manuscrits & projets",
  link3_2: "Collection Raconter le monde",
  link3_3: "Collection Immersion",
  link3_4: "Collection Manifestes",
  link3_5: "Romans jeunesse",
  section4: "✦ Poésie & Arts",
  link4_1: "Poésie au jour le jour",
  link4_2: "Peintures & Dessins",
  link4_3: "Événements & Presse",
  section5: "✦ Liens utiles",
  link5_1: "Boutique",
  link5_2: "FAQ",
  link5_3: "Contact",
  link5_4: "Chaîne Youtube",
  link5_5: "Mentions légales",
  footer: "© L'AMagie ✦ Maison d'édition indépendante ✦ Félines-Minervois"
};

const contentEN = {
  bandeau: "L'AMagie editions support independent bookstores worldwide",
  titre: "L'AMagie — Independent, non-conformist Publishing House",
  section1: "✦ About Us",
  link1_1: "About Us",
  link1_2: "How the Association Works",
  link1_3: "Anouk Journo",
  link1_4: "Meichelus",
  section2: "✦ Workshops & Coaching",
  link2_1: "Workshops & Coaching",
  link2_2: "Therapeutic Writing",
  link2_3: "Animal Mediation",
  link2_4: "Friends-Words Collection",
  section3: "✦ Editions",
  link3_1: "Manuscripts & Projects",
  link3_2: "Collection: Telling the World (Raconter le monde)",
  link3_3: "Immersion Collection",
  link3_4: "Manifestos Collection",
  link3_5: "Young Adult Novels",
  section4: "✦ Poetry & Arts",
  link4_1: "Poetry Day by Day",
  link4_2: "Paintings & Drawings",
  link4_3: "Events & Press",
  section5: "✦ Useful Links",
  link5_1: "Shop",
  link5_2: "FAQ",
  link5_3: "Contact",
  link5_4: "Youtube Channel",
  link5_5: "Legal Notice",
  footer: "© L'AMagie ✦ Independent Publishing House | Worldwide Publications ✦ Félines-Minervois"
};

function setLanguage(lang) {
  const content = lang === 'fr' ? contentFR : contentEN;
  
  document.querySelector('.bandeau-text').textContent = content.bandeau;
  document.querySelector('.titre-principal').textContent = content.titre;
  document.querySelector('.section-title-1').textContent = content.section1;
  document.querySelector('.link-1-1').textContent = content.link1_1;
  document.querySelector('.link-1-2').textContent = content.link1_2;
  document.querySelector('.link-1-3').textContent = content.link1_3;
  document.querySelector('.link-1-4').textContent = content.link1_4;
  document.querySelector('.section-title-2').textContent = content.section2;
  document.querySelector('.link-2-1').textContent = content.link2_1;
  document.querySelector('.link-2-2').textContent = content.link2_2;
  document.querySelector('.link-2-3').textContent = content.link2_3;
  document.querySelector('.link-2-4').textContent = content.link2_4;
  document.querySelector('.section-title-3').textContent = content.section3;
  document.querySelector('.link-3-1').textContent = content.link3_1;
  document.querySelector('.link-3-2').textContent = content.link3_2;
  document.querySelector('.link-3-3').textContent = content.link3_3;
  document.querySelector('.link-3-4').textContent = content.link3_4;
  document.querySelector('.link-3-5').textContent = content.link3_5;
  document.querySelector('.section-title-4').textContent = content.section4;
  document.querySelector('.link-4-1').textContent = content.link4_1;
  document.querySelector('.link-4-2').textContent = content.link4_2;
  document.querySelector('.link-4-3').textContent = content.link4_3;
  document.querySelector('.section-title-5').textContent = content.section5;
  document.querySelector('.link-5-1').textContent = content.link5_1;
  document.querySelector('.link-5-2').textContent = content.link5_2;
  document.querySelector('.link-5-3').textContent = content.link5_3;
  document.querySelector('.link-5-4').textContent = content.link5_4;
  document.querySelector('.link-5-5').textContent = content.link5_5;
  document.querySelector('.footer-text').textContent = content.footer;
  
  document.documentElement.lang = lang;
  
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
  
  localStorage.setItem('l-amagie-lang', lang);
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    setLanguage(this.getAttribute('data-lang'));
  });
});

window.addEventListener('DOMContentLoaded', function() {
  const savedLang = localStorage.getItem('l-amagie-lang') || 'fr';
  setLanguage(savedLang);
});

</script>

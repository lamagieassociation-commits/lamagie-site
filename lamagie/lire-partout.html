const TEXTES = {
  fr: {
    retour: "← Retour à l'accueil",
    surtitre: "Nos livres voyagent",
    titre: "Lire partout",
    intro: "Certains de nos livres existent en version numérique, d'autres ont pris un titre anglais et traversé l'Atlantique. Vous les trouverez tous ici, avec un lien direct vers les librairies en ligne qui les proposent.",

  en: {

    footer: "© L'AMagie ✦ Independent Publishing House | Worldwide Publications ✦ Félines-Minervois"
  }
};

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function couverture(oeuvre, lang, titre){
  const box = el('div', 'couverture');
  const isbn = (lang === 'en' && oeuvre.couvertureEn) ? oeuvre.couvertureEn : oeuvre.couverture;
  const sources = [`images/livres/${isbn}.jpg`];
  if (oeuvre.appleImg && isbn === oeuvre.couverture) sources.push(oeuvre.appleImg);
  const img = document.createElement('img');
  img.alt = titre;
  img.loading = 'lazy';
  let i = 0;
  img.onerror = () => {
    i++;
    if (i < sources.length) { img.src = sources[i]; }
    else { box.innerHTML = ''; box.appendChild(el('div', 'sans-image', titre)); }
  };
  img.src = sources[0];
  box.appendChild(img);
  return box;
}

function render(lang){
  const T = TEXTES[lang];
  const main = document.getElementById('catalogue');
  main.innerHTML = '';

  CATALOGUE.forEach(groupe => {
    main.appendChild(el('h2', 'rubrique', T.rubriques[groupe.rubrique]));

    groupe.oeuvres.forEach(o => {
      const titre = o.titre[lang];
      const art = el('article', 'oeuvre');
      art.appendChild(couverture(o, lang, titre));

      const txt = el('div');
      txt.appendChild(el('h3', null, titre));
      const aut = o.serie ? `${o.serie[lang]} · ${o.auteurs[lang]}` : o.auteurs[lang];
      txt.appendChild(el('p', 'auteurs', aut));
      txt.appendChild(el('p', 'resume', o.resume[lang]));
      if (o.note) txt.appendChild(el('p', 'note', o.note[lang]));

      const ul = el('ul', 'editions');
      o.editions.forEach(ed => {
        const li = el('li');
        const info = el('span', 'ed-info');
        info.appendChild(el('span', 'format', `${T.formats[ed.format]} ${T.langues[ed.langue]}`));
        if (ed.titre && ed.titre !== titre) {
          info.appendChild(document.createTextNode(' — '));
          info.appendChild(el('span', 'titre-ed', ed.titre));
          if (ed.premiere) info.appendChild(document.createTextNode(` (${T.premiere})`));
        }
        info.appendChild(el('span', 'isbn', `ISBN ${ed.isbn}`));
        li.appendChild(info);

        const liens = el('span', 'liens');
        Object.entries(ed.liens || {}).forEach(([boutique, url]) => {
          if (!url) return;
          const a = el('a', 'btn', T.boutiques[boutique] || boutique);
          a.href = url;
          if (/^https?:/.test(url)) { a.target = '_blank'; a.rel = 'noopener'; }
          liens.appendChild(a);
        });
        if (!liens.children.length) liens.appendChild(el('span', 'bientot', T.bientot));
        li.appendChild(liens);
        ul.appendChild(li);
      });
      txt.appendChild(ul);
      art.appendChild(txt);
      main.appendChild(art);
    });
  });
}

function setLanguage(lang){
  const T = TEXTES[lang];
  document.querySelectorAll('[data-t]').forEach(n => {
    const v = T[n.getAttribute('data-t')];
    if (n.hasAttribute('data-html')) n.innerHTML = v; else n.textContent = v;
  });
  document.title = `${T.titre} — L'AMagie`;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  render(lang);
  try { localStorage.setItem('l-amagie-lang', lang); } catch(e) {}
}

document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.lang)));

window.addEventListener('DOMContentLoaded', () => {
  let saved = 'fr';
  try { saved = localStorage.getItem('l-amagie-lang') || 'fr'; } catch(e) {}
  setLanguage(saved);
});
</script>
